services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /app
    ipc: host
    environment:
      CI: "1"
      VISUAL: "1"
    volumes:
      - .:/app
      # Linux binaries live in a named volume, apart from the Windows ones in the host node_modules.
      - pp_node_modules:/app/node_modules
    command: ["bash", "docker/playwright.sh"]

  # Optional analytics stack (Task 9): docker compose --profile analytics up -d
  umami:
    profiles: ["analytics"]
    image: ghcr.io/umami-software/umami:postgresql-latest # pin the version tag in Task 9
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-}:${UMAMI_DB_PASSWORD:-}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
    depends_on:
      - umami-db

  umami-db:
    profiles: ["analytics"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: ${UMAMI_DB_USER:-}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-}
    volumes:
      - umami_db:/var/lib/postgresql/data

volumes:
  pp_node_modules:
  umami_db:
