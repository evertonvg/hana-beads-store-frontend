<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pixel Perfect — 404 (celular)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14121F}
a{color:#FF8CC4}a:hover{color:#FFD23F}
@keyframes cai{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes pisca{0%,49%{opacity:1}50%,100%{opacity:0}}
.cai{animation:cai 1.6s ease-in-out infinite}
.pisca{animation:pisca 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){.cai,.pisca{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #14121F; color: #EDE9FF; font-family: 'Space Mono', monospace; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 10px 12px; border-bottom: 3px solid #2C2840; display: flex; align-items: center; justify-content: center">
<a href="CelHome.dc.html" style="font-family: 'Press Start 2P', monospace; font-size: 11px; line-height: 1.5; text-decoration: none; color: #EDE9FF; text-align: center; padding: 6px 0">PIXEL PERFECT<br><span style="font-size: 7px; color: #A9A3C9">ARTESANATO</span></a>
</header>

<main style="flex: 1; padding: 36px 16px 28px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
<div style="position: relative; padding-top: 46px" role="img" aria-label="Número 404 feito de blocos, com um bloco faltando caindo no lugar">
<div style="display: grid; grid-template-columns: repeat(17, 18px); grid-auto-rows: 18px">
<sc-for list="{{blocos}}" as="b" hint-placeholder-count="119"><div style="background: {{b.bg}}; box-shadow: {{b.sh}}; outline: {{b.contorno}}; outline-offset: -3px"></div></sc-for>
</div>
<div class="cai" style="position: absolute; top: 0; left: 108px; width: 18px; height: 18px; background: #FFD23F; box-shadow: inset 3px 3px 0 rgba(255,255,255,0.4), inset -3px -3px 0 rgba(0,0,0,0.3)"></div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; align-items: center">
<p style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 9px; color: #FFD23F">ERRO 404</p>
<h1 style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 18px; line-height: 1.5">FASE NÃO <span style="color: {{accent}}">ENCONTRADA</span></h1>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #C9C4E3">Esta peça se perdeu no caminho. O link pode estar quebrado ou a página mudou de lugar.</p>
</div>

<div style="width: 100%; background: #2C2840; border: 3px solid #EDE9FF; box-shadow: 6px 6px 0 {{accent}}; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-family: 'Press Start 2P', monospace; font-size: 13px">CONTINUE?</p>
<a href="CelHome.dc.html" style="display: flex; align-items: center; gap: 12px; font-family: 'Press Start 2P', monospace; font-size: 10px; text-decoration: none; color: #14121F; background: {{accent}}; padding: 16px; text-align: left"><span class="pisca" aria-hidden="true">▶</span>SIM · VOLTAR AO INÍCIO</a>
<a href="CelLoja.dc.html" style="display: flex; align-items: center; gap: 12px; font-family: 'Press Start 2P', monospace; font-size: 10px; text-decoration: none; color: #EDE9FF; border: 3px solid #EDE9FF; padding: 13px 16px; text-align: left"><span style="width: 10px" aria-hidden="true"></span>NÃO · IR PRA LOJA</a>
</div>

<div style="margin-top: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; font-size: 14px">
<a href="Encomendas.dc.html">Encomendas</a><a href="CelPedidos.dc.html">Meus pedidos</a><a href="https://ig.me/m/[usuario]">Instagram</a>
</div>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5FAE","options":["#FF5FAE","#4FD1FF","#7CFF6B","#FF8A3D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF5FAE';
    const Q = ['#...#', '#...#', '#...#', '#####', '....#', '....#', '....#'];
    const Z = ['.###.', '#...#', '#...#', 'o...#', '#...#', '#...#', '.###.'];
    const linhas = Q.map((_, r) => Q[r] + '.' + Z[r] + '.' + Q[r]);
    const cor = (c) => (c < 5 ? accent : c < 12 ? '#FFD23F' : '#4FD1FF');
    const sh = 'inset 3px 3px 0 rgba(255,255,255,0.4), inset -3px -3px 0 rgba(0,0,0,0.3), inset 0 0 0 1px rgba(0,0,0,0.3)';
    const blocos = [];
    linhas.forEach((l) => { for (let c = 0; c < l.length; c++) {
      const ch = l[c];
      if (ch === '#') blocos.push({ bg: cor(c), sh, contorno: 'none' });
      else if (ch === 'o') blocos.push({ bg: 'transparent', sh: 'none', contorno: '2px dashed #4A4566' });
      else blocos.push({ bg: 'transparent', sh: 'none', contorno: 'none' });
    } });
    return { accent, blocos };
  }
}
</script>
</body>
</html>
