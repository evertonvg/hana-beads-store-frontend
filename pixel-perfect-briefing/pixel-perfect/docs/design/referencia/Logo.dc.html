<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pixel Perfect — Logos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0C16}
</style>
</helmet>
<div style="width: 1640px; height: 1200px; box-sizing: border-box; padding: 60px; background: #0E0C16; font-family: 'Space Mono', monospace; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 40px">

<div style="background: #14121F; border: 3px solid #2C2840; display: flex; flex-direction: column">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
<div style="display: grid; grid-template-columns: {{l1.tpl}}; grid-template-rows: {{l1.rows}}; gap: 3px" role="img" aria-label="Letra P feita de continhas, com uma conta rosa separada">
<sc-for list="{{l1.cells}}" as="c" hint-placeholder-count="63"><div style="background: {{c.bg}}; border-radius: {{c.radius}}; box-shadow: {{c.shadow}}"></div></sc-for>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<span style="font-family: 'Press Start 2P', monospace; font-size: 20px; color: #EDE9FF">PIXEL PERFECT</span>
<span style="font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 0.4em; color: #FF5FAE">ARTESANATO</span>
</div>
</div>
<p style="margin: 0; padding: 16px 20px; border-top: 3px solid #2C2840; font-family: 'Press Start 2P', monospace; font-size: 9px; color: #A9A3C9">01 · A CONTA PERFEITA</p>
</div>

<div style="background: #FFF4F9; border: 3px solid #2C2840; display: flex; flex-direction: column">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
<div style="display: grid; grid-template-columns: {{l2.tpl}}; grid-template-rows: {{l2.rows}}; gap: 2px" role="img" aria-label="Coração em pixel com um pixel faltando, caindo no lugar">
<sc-for list="{{l2.cells}}" as="c" hint-placeholder-count="121"><div style="background: {{c.bg}}; border-radius: {{c.radius}}; box-shadow: {{c.shadow}}"></div></sc-for>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<span style="font-family: 'Press Start 2P', monospace; font-size: 20px; color: #14121F">pixel<span style="color: #E0307F">perfect</span></span>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.3em; color: #14121F">ARTESANATO</span>
</div>
</div>
<p style="margin: 0; padding: 16px 20px; border-top: 3px solid #F2D3E2; font-family: 'Press Start 2P', monospace; font-size: 9px; color: #5C5870">02 · O ÚLTIMO PIXEL</p>
</div>

<div style="background: #2C2840; border: 3px solid #2C2840; display: flex; flex-direction: column">
<div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 28px">
<div style="display: flex; flex-direction: column; align-items: center" role="img" aria-label="Chaveiro com argola e plaquinha rosa com as letras PP em continhas">
<div style="width: 44px; height: 44px; border-radius: 50%; border: 8px solid #C9C4E3; box-sizing: border-box"></div>
<div style="width: 8px; height: 10px; background: #C9C4E3"></div>
<div style="width: 14px; height: 8px; border: 4px solid #C9C4E3; border-radius: 4px; box-sizing: content-box; margin-top: -2px"></div>
<div style="width: 8px; height: 10px; background: #C9C4E3"></div>
<div style="background: #FF5FAE; padding: 16px; border-radius: 10px; box-shadow: 6px 6px 0 #14121F">
<div style="display: grid; grid-template-columns: {{l3.tpl}}; grid-template-rows: {{l3.rows}}; gap: 2px">
<sc-for list="{{l3.cells}}" as="c" hint-placeholder-count="55"><div style="background: {{c.bg}}; border-radius: {{c.radius}}; box-shadow: {{c.shadow}}"></div></sc-for>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'Press Start 2P', monospace; font-size: 18px; line-height: 1.5; color: #EDE9FF">PIXEL<br>PERFECT</span>
<span style="font-family: 'Press Start 2P', monospace; font-size: 8px; letter-spacing: 0.3em; color: #FFD23F">ARTESANATO</span>
</div>
</div>
<p style="margin: 0; padding: 16px 20px; border-top: 3px solid #3A3554; font-family: 'Press Start 2P', monospace; font-size: 9px; color: #C9C4E3">03 · O PRÓPRIO CHAVEIRO</p>
</div>

<div style="background: #FFD23F; border: 3px solid #2C2840; display: flex; flex-direction: column">
<div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 24px">
<div style="display: grid; grid-template-columns: {{l4.tpl}}; grid-template-rows: {{l4.rows}}; gap: 0" role="img" aria-label="Mascote: uma continha rosa com rostinho e bochechas">
<sc-for list="{{l4.cells}}" as="c" hint-placeholder-count="144"><div style="background: {{c.bg}}; border-radius: {{c.radius}}; box-shadow: {{c.shadow}}"></div></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'Press Start 2P', monospace; font-size: 18px; line-height: 1.5; color: #14121F">PIXEL<br>PERFECT</span>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.25em; color: #14121F">ARTESANATO</span>
</div>
</div>
<p style="margin: 0; padding: 16px 20px; border-top: 3px solid #E5B92C; font-family: 'Press Start 2P', monospace; font-size: 9px; color: #14121F">04 · MASCOTE "CONTINHA"</p>
</div>

<div style="background: #14121F; border: 3px solid #2C2840; display: flex; flex-direction: column">
<div style="flex: 1; display: flex; align-items: center; justify-content: center">
<div style="width: 300px; height: 300px; background: #FFD23F; clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); display: flex; align-items: center; justify-content: center" role="img" aria-label="Selo octogonal de fliperama com estrela de continhas no centro">
<div style="width: 284px; height: 284px; background: #14121F; clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
<span style="font-family: 'Press Start 2P', monospace; font-size: 13px; color: #FFD23F">PIXEL PERFECT</span>
<div style="display: grid; grid-template-columns: {{l5.tpl}}; grid-template-rows: {{l5.rows}}; gap: 1px">
<sc-for list="{{l5.cells}}" as="c" hint-placeholder-count="169"><div style="background: {{c.bg}}; border-radius: {{c.radius}}; box-shadow: {{c.shadow}}"></div></sc-for>
</div>
<span style="font-family: 'Press Start 2P', monospace; font-size: 7px; letter-spacing: 0.2em; color: #EDE9FF">★ FEITO À MÃO ★</span>
</div>
</div>
</div>
<p style="margin: 0; padding: 16px 20px; border-top: 3px solid #2C2840; font-family: 'Press Start 2P', monospace; font-size: 9px; color: #A9A3C9">05 · SELO DE FLIPERAMA</p>
</div>

<div style="background: #1E1B2E; border: 3px solid #2C2840; display: flex; flex-direction: column">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px" role="img" aria-label="Palavras PIXEL PERFECT escritas com continhas sobre uma placa de pinos">
<div style="display: grid; grid-template-columns: {{l6a.tpl}}; grid-template-rows: {{l6a.rows}}; gap: 2px">
<sc-for list="{{l6a.cells}}" as="c" hint-placeholder-count="125"><div style="background: {{c.bg}}; border-radius: {{c.radius}}; box-shadow: {{c.shadow}}"></div></sc-for>
</div>
<div style="display: grid; grid-template-columns: {{l6b.tpl}}; grid-template-rows: {{l6b.rows}}; gap: 2px">
<sc-for list="{{l6b.cells}}" as="c" hint-placeholder-count="185"><div style="background: {{c.bg}}; border-radius: {{c.radius}}; box-shadow: {{c.shadow}}"></div></sc-for>
</div>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.5em; color: #A9A3C9; padding-top: 8px">ARTESANATO</span>
</div>
<p style="margin: 0; padding: 16px 20px; border-top: 3px solid #2C2840; font-family: 'Press Start 2P', monospace; font-size: 9px; color: #A9A3C9">06 · PLACA DE PINOS</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1640,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (rows, pal, size, kind) => {
      const cells = [];
      rows.forEach((r) => {
        for (let i = 0; i < r.length; i++) {
          const c = pal[r[i]];
          if (!c) { cells.push({ bg: 'transparent', radius: '0', shadow: 'none' }); continue; }
          if (kind === 'bead') cells.push({ bg: 'transparent', radius: '50%', shadow: 'inset 0 0 0 ' + Math.max(2, Math.round(size * 0.32)) + 'px ' + c });
          else cells.push({ bg: c, radius: '0', shadow: 'none' });
        }
      });
      return { tpl: 'repeat(' + rows[0].length + ', ' + size + 'px)', rows: 'repeat(' + rows.length + ', ' + size + 'px)', cells };
    };
    const F = {
      P: ['####.', '#...#', '####.', '#....', '#....'],
      I: ['###', '.#.', '.#.', '.#.', '###'],
      X: ['#...#', '.#.#.', '..#..', '.#.#.', '#...#'],
      E: ['####', '#...', '###.', '#...', '####'],
      L: ['#...', '#...', '#...', '#...', '####'],
      R: ['####.', '#...#', '####.', '#..#.', '#...#'],
      F: ['####', '#...', '###.', '#...', '#...'],
      C: ['.###', '#...', '#...', '#...', '.###'],
      T: ['#####', '..#..', '..#..', '..#..', '..#..']
    };
    const word = (t) => {
      const rows = ['', '', '', '', ''];
      t.split('').forEach((ch, i) => { for (let r = 0; r < 5; r++) rows[r] += (i ? '.' : '') + F[ch][r]; });
      return rows;
    };
    const monoP = [
      '#####..',
      '######.',
      '##..###',
      '##...##',
      '##..###',
      '######.',
      '#####..',
      '##.....',
      '##....*'
    ];
    const coracao = [
      '.........*.',
      '...........',
      '..##...##..',
      '.####.####.',
      '###########',
      '#######.###',
      '###########',
      '.#########.',
      '..#######..',
      '...#####...',
      '....###....'
    ];
    const mascote = [
      '....####....',
      '..##pppp##..',
      '.#pppppppp#.',
      '#ppppwwpppp#',
      '#ppppwwpppp#',
      '#pppppppppp#',
      '#ppkppppkpp#',
      '#ppkppppkpp#',
      '#bppppppppb#',
      '.#pppkkppp#.',
      '..##pppp##..',
      '....####....'
    ];
    const estrela = [
      '......#......',
      '.....###.....',
      '.....###.....',
      '....#####....',
      '#############',
      '.###########.',
      '..#########..',
      '...#######...',
      '...#######...',
      '..#########..',
      '..####.####..',
      '.###.....###.',
      '.##.......##.'
    ];
    return {
      l1: mk(monoP, { '#': '#EDE9FF', '*': '#FF5FAE' }, 26, 'bead'),
      l2: mk(coracao, { '#': '#FF5FAE', '*': '#14121F' }, 20, 'square'),
      l3: mk(word('PP'), { '#': '#FFFFFF' }, 12, 'bead'),
      l4: mk(mascote, { '#': '#14121F', 'p': '#FF5FAE', 'k': '#14121F', 'b': '#FFB3D6', 'w': '#FFD23F' }, 13, 'square'),
      l5: mk(estrela, { '#': '#E8302A' }, 11, 'bead'),
      l6a: mk(word('PIXEL'), { '#': '#FF5FAE', '.': '#2E2A44' }, 12, 'bead'),
      l6b: mk(word('PERFECT'), { '#': '#FFD23F', '.': '#2E2A44' }, 12, 'bead')
    };
  }
}
</script>
</body>
</html>
